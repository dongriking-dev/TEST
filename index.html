<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページ更新・閲覧カウンター - Visit Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-once { animation: pulseOnce 0.6s cubic-bezier(0.4, 0, 0.6, 1); }
        @keyframes pulseOnce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col antialiased transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-sky-500 to-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center font-extrabold text-lg shadow-sm">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 dark:text-white leading-tight">ページ更新カウンター</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
                        <i class="fa-solid fa-hard-drive text-emerald-500 text-[10px]"></i> LocalStorage 自動追跡
                    </p>
                </div>
            </div>

            <!-- Header Action Controls -->
            <div class="flex items-center space-x-2">
                <!-- Theme Toggle -->
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 transition" title="ダークモード切替">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>

                <!-- Reload Button -->
                <button onclick="location.reload()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium shadow-sm transition active:scale-95 flex items-center space-x-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="hidden sm:inline">再読み込み (更新)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-6">

        <!-- Counter Hero Card -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-700 shadow-xl text-center relative overflow-hidden">
            <div class="absolute -right-12 -top-12 w-40 h-40 bg-sky-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -left-12 -bottom-12 w-40 h-40 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <p class="text-xs font-semibold text-sky-600 dark:text-sky-400 uppercase tracking-widest mb-2 flex items-center justify-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 累計ページ更新・閲覧回数
            </p>

            <div class="my-4">
                <span id="counter-display" class="text-6xl sm:text-7xl font-extrabold text-slate-900 dark:text-white tracking-tight inline-block transition-transform duration-200">
                    0
                </span>
                <span class="text-xl sm:text-2xl font-bold text-slate-400 dark:text-slate-500 ml-2">回</span>
            </div>

            <p id="last-visit-time" class="text-xs text-slate-500 dark:text-slate-400 mb-6">
                <!-- Timestamp populated by JS -->
            </p>

            <!-- Hero Action Buttons -->
            <div class="flex flex-wrap items-center justify-center gap-3">
                <button onclick="openNoteModalForLatest()" class="bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition active:scale-95 shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-sky-400 dark:text-sky-600"></i>
                    <span>今回の訪問にメモを残す</span>
                </button>
                <button onclick="confirmReset()" class="bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition border border-rose-200 dark:border-rose-800/50 flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>カウントをリセット</span>
                </button>
            </div>
        </div>

        <!-- Visit Log & History Section -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200/80 dark:border-slate-700 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                <div>
                    <h2 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-sky-500"></i> 閲覧・更新履歴ログ
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">ページを読み込んだ日時とメモの記録一覧</p>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="log-count" class="text-xs px-3 py-1 bg-slate-100 dark:bg-slate-700/80 rounded-full text-slate-600 dark:text-slate-300 font-medium">
                        全 0 件
                    </span>
                    <button onclick="exportHistoryJSON()" class="p-2 text-xs bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 rounded-xl transition" title="JSON形式で保存">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>

            <!-- History Table / List -->
            <div id="history-container" class="space-y-3">
                <!-- Log Cards dynamically generated here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12">
                <i class="fa-solid fa-ghost text-4xl text-slate-300 dark:text-slate-600 mb-3 block"></i>
                <p class="text-sm text-slate-500 dark:text-slate-400">履歴データはありません。</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-4 text-center text-xs text-slate-400">
        Page View Counter App &bull; LocalStorage Enabled
    </footer>

    <!-- Note Modal -->
    <div id="note-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div id="note-modal-content" class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-200">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 dark:border-slate-700/60 pb-3">
                <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-sky-500"></i> <span id="modal-title">訪問ログにメモを追加</span>
                </h3>
                <button onclick="closeNoteModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="saveNote(event)" class="space-y-4">
                <input type="hidden" id="target-visit-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">メモ内容</label>
                    <textarea id="note-text-input" rows="4" placeholder="例: 「新機能のテスト」「午前中の動作確認」など..." class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500 transition resize-none"></textarea>
                </div>

                <div class="flex items-center justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeNoteModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        キャンセル
                    </button>
                    <button type="submit" class="bg-sky-600 hover:bg-sky-700 text-white px-5 py-2 rounded-xl text-xs font-medium shadow-sm transition">
                        保存する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Reset Modal -->
    <div id="reset-confirm-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl max-w-sm w-full p-6 text-center border border-slate-200 dark:border-slate-700">
            <div class="w-12 h-12 rounded-full bg-rose-100 dark:bg-rose-900/50 text-rose-600 dark:text-rose-400 flex items-center justify-center mx-auto mb-3 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h4 class="font-bold text-slate-900 dark:text-white text-base mb-1">カウントをリセットしますか？</h4>
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-5">これまでの全閲覧回数および訪問履歴ログが消去されます。</p>
            <div class="flex space-x-3">
                <button onclick="closeResetModal()" class="w-1/2 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 py-2.5 rounded-xl text-xs font-medium hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                    キャンセル
                </button>
                <button onclick="executeReset()" class="w-1/2 bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-xl text-xs font-medium transition shadow-sm">
                    リセットする
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Modal -->
    <div id="toast-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl max-w-xs w-full p-5 text-center border border-slate-200 dark:border-slate-700">
            <div id="toast-icon" class="w-10 h-10 rounded-full bg-sky-100 dark:bg-sky-900/50 text-sky-600 dark:text-sky-400 flex items-center justify-center mx-auto mb-2 text-lg">
                <i class="fa-solid fa-check"></i>
            </div>
            <h4 id="toast-title" class="font-bold text-slate-900 dark:text-white text-sm mb-1">完了</h4>
            <p id="toast-message" class="text-xs text-slate-500 dark:text-slate-400 mb-4">更新されました。</p>
            <button onclick="closeToast()" class="w-full bg-sky-600 hover:bg-sky-700 text-white py-2 rounded-xl text-xs font-medium transition">
                OK
            </button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const STORAGE_KEY = 'page_view_counter_history_v1';
        const THEME_KEY = 'page_view_counter_theme';

        let historyLogs = [];

        window.onload = function() {
            initTheme();
            recordCurrentVisit();
            renderLogs();
        };

        // Theme Setup
        function initTheme() {
            const savedTheme = localStorage.getItem(THEME_KEY);
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').className = 'fa-solid fa-moon';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        // Record Current Visit on Page Load
        function recordCurrentVisit() {
            const rawData = localStorage.getItem(STORAGE_KEY);
            if (rawData) {
                try {
                    historyLogs = JSON.parse(rawData);
                } catch(e) {
                    historyLogs = [];
                }
            }

            const now = Date.now();
            const newCount = historyLogs.length + 1;

            const newEntry = {
                id: 'visit_' + now,
                countIndex: newCount,
                timestamp: now,
                note: ''
            };

            historyLogs.unshift(newEntry); // Add to beginning
            localStorage.setItem(STORAGE_KEY, JSON.stringify(historyLogs));

            // Animate Counter
            animateCounter(newCount);

            // Last visit timestamp format
            const formattedDate = new Date(now).toLocaleString('ja-JP', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
            document.getElementById('last-visit-time').innerText = `最終アクセス日時: ${formattedDate}`;
        }

        // Count Number Animation
        function animateCounter(targetNumber) {
            const displayEl = document.getElementById('counter-display');
            let start = 0;
            const duration = 600;
            const stepTime = Math.max(Math.floor(duration / Math.max(targetNumber, 1)), 10);

            displayEl.classList.add('pulse-once');

            if (targetNumber > 50) {
                displayEl.innerText = targetNumber;
                return;
            }

            const timer = setInterval(() => {
                start += 1;
                displayEl.innerText = start;
                if (start >= targetNumber) {
                    clearInterval(timer);
                    displayEl.innerText = targetNumber;
                }
            }, stepTime);
        }

        // Render Visit Log Cards
        function renderLogs() {
            const container = document.getElementById('history-container');
            const emptyState = document.getElementById('empty-state');
            document.getElementById('log-count').innerText = `全 ${historyLogs.length} 件`;

            if (historyLogs.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                document.getElementById('counter-display').innerText = '0';
                document.getElementById('last-visit-time').innerText = 'まだ訪問記録はありません。';
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            container.innerHTML = '';

            historyLogs.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "fade-in bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200/70 dark:border-slate-700/70 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-sky-300 dark:hover:border-sky-600 transition";

                const dateStr = new Date(item.timestamp).toLocaleString('ja-JP', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });

                const isLatest = index === 0;

                card.innerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="${isLatest ? 'bg-sky-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300'} px-3 py-1.5 rounded-xl font-bold text-xs shrink-0 mt-0.5">
                            #${item.countIndex} ${isLatest ? '<span class="ml-1 text-[10px] font-normal opacity-90">(今回)</span>' : ''}
                        </div>
                        <div>
                            <div class="text-xs font-semibold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                                <i class="fa-regular fa-clock text-slate-400"></i> ${dateStr}
                            </div>
                            ${item.note ? `
                                <div class="mt-2 text-xs text-sky-800 dark:text-sky-300 bg-sky-50 dark:bg-sky-950/50 px-3 py-1.5 rounded-lg border border-sky-100 dark:border-sky-900/60 flex items-center gap-1.5">
                                    <i class="fa-solid fa-comment text-sky-500"></i> ${escapeHtml(item.note)}
                                </div>
                            ` : `
                                <div class="mt-1 text-xs text-slate-400 italic">メモなし</div>
                            `}
                        </div>
                    </div>
                    <div class="self-end sm:self-center">
                        <button onclick="openNoteModal('${item.id}')" class="px-3 py-1.5 text-xs bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 rounded-lg font-medium text-slate-600 dark:text-slate-300 transition flex items-center gap-1">
                            <i class="fa-solid fa-pencil text-slate-400"></i>
                            <span>${item.note ? 'メモ編集' : 'メモ追加'}</span>
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Open Note Modal for Specific Visit
        function openNoteModal(id) {
            const target = historyLogs.find(h => h.id === id);
            if (!target) return;

            document.getElementById('target-visit-id').value = target.id;
            document.getElementById('note-text-input').value = target.note || '';
            document.getElementById('modal-title').innerText = `#${target.countIndex} 回目の訪問にメモを追加`;

            const modal = document.getElementById('note-modal');
            const content = document.getElementById('note-modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function openNoteModalForLatest() {
            if (historyLogs.length > 0) {
                openNoteModal(historyLogs[0].id);
            }
        }

        function closeNoteModal() {
            const modal = document.getElementById('note-modal');
            const content = document.getElementById('note-modal-content');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
        }

        function saveNote(e) {
            e.preventDefault();
            const id = document.getElementById('target-visit-id').value;
            const text = document.getElementById('note-text-input').value.trim();

            const idx = historyLogs.findIndex(h => h.id === id);
            if (idx !== -1) {
                historyLogs[idx].note = text;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(historyLogs));
                renderLogs();
                closeNoteModal();
                showToast("保存完了", "メモを書き込みました。");
            }
        }

        // Reset Counter Flow
        function confirmReset() {
            const modal = document.getElementById('reset-confirm-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeResetModal() {
            document.getElementById('reset-confirm-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        function executeReset() {
            historyLogs = [];
            localStorage.removeItem(STORAGE_KEY);
            closeResetModal();
            renderLogs();
            showToast("リセット完了", "カウンターと履歴ログをリセットしました。");
        }

        // Export JSON History
        function exportHistoryJSON() {
            if (historyLogs.length === 0) {
                showToast("お知らせ", "エクスポートするデータがありません。");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(historyLogs, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `visit_counter_history_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            showToast("書き出し完了", "履歴データのJSONファイルを保存しました。");
        }

        // Toast Helper
        function showToast(title, msg) {
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-message').innerText = msg;
            const toast = document.getElementById('toast-modal');
            toast.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeToast() {
            document.getElementById('toast-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
